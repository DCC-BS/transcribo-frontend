[install]
minimumReleaseAge = 604800 # 7 days in seconds
# These packages will bypass the 7-day minimum age requirement
minimumReleaseAgeExcludes = [
    "@types/bun", "@dcc-bs/audio-recorder.bs.js", "@dcc-bs/common-ui.bs.js", "@dcc-bs/communication.bs.js", "@dcc-bs/event-system.bs.js", "@dcc-bs/dependency-injection.bs.js",
    # TEMPORARY until 2026-11-03: nuxt 4.6.3 fixes GHSA-9v7c-q64q-vv33 (dot segments bypass server/middleware
    # path checks) and three dev-server advisories but is younger than the 7-day cooldown. The weekly
    # dependency routine removes these entries once 4.6.3 is 7 days old.
    "nuxt", "@nuxt/kit", "@nuxt/schema", "@nuxt/vite-builder", "@nuxt/vite-server", "@nuxt/nitro-server",
]