name: Build & Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    APP_MODE: "ci"
    CI: true

permissions:
    contents: read

jobs:
    frontend-ci:
        uses: DCC-BS/ci-workflows/.github/workflows/ci.yml@4594d0b9ddf95dcd54c25e599f927d5a23ae7950 # v10.0.6
        permissions:
            contents: read
            pull-requests: write
